name: Build Desktop App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            rust_target: 'aarch64-apple-darwin'
            arch: 'arm64'
          - platform: 'macos-latest'
            rust_target: 'x86_64-apple-darwin'
            arch: 'x64'
          - platform: 'ubuntu-22.04'
            rust_target: 'x86_64-unknown-linux-gnu'
            arch: 'x64'
          - platform: 'windows-latest'
            rust_target: 'x86_64-pc-windows-msvc'
            arch: 'x64'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust_target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'ExportDashCam v__VERSION__'
          releaseBody: |
            下载适合您平台的桌面应用程序。

            ## 更新内容 (v0.2.3)
            - **首页布局优化**: 窗口高度 ≤750px 或宽度 ≤768px 时，9 个功能卡片自动切换为单行紧凑模式
            - **悬停提示卡片**: 紧凑模式下悬停小卡片显示大卡片详情，带半透明磨砂背景效果
            - **布局配置层级修复**: PiP/三视图/六视图配置面板层级提升，macOS 全屏下不再被地图遮挡
            - **窗口默认尺寸**: 启动时默认窗口改为 1100×720（非全屏）
            - **键盘快捷键**: ←→ 方向键调整 1 秒，Shift+←→ 调整 5 秒
            - **标题栏磨砂效果**: 顶部标题栏添加半透明磨砂背景

            ## 历史更新
            - LanguageSwitcher 简化（点击图标直接切换语言）
            - TelemetryTimeline 拖拽优化（边界拖拽、片段合并）
            - VideoPlayer 按钮和布局改进
            - i18n 新增翻译（中文/英文）

            ## 桌面应用程序
            - **Windows**: `.msi` 或 `.exe` 安装程序
            - **macOS**: `.dmg` 磁盘镜像
              - Apple Silicon (M1/M2/M3): 下载文件名含 `aarch64` 或 `arm64` 的版本
              - Intel Mac: 下载文件名含 `x86_64` 或 `x64` 的版本
            - **Linux**: `.AppImage` 或 `.deb`
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.rust_target }}
